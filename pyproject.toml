[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-local-client"
version = "0.1.0"
description = "Internal library to extract, load and modify data in PostgreSQL on a VM via SSH tunnel"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rabbit", email = "data@company.local" }]
license = { text = "Proprietary" }

# Politica de dependencias (ver docs/compatibilidad.md):
# rangos con `>=` y SIN techo. Un techo preventivo en una libreria interna se
# vuelve un conflicto irresoluble cuando un proyecto host la instala junto a
# otra del ecosistema. Los pisos son el minimo real probado.
dependencies = [
  "pandas>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "sqlglot>=20",
  "sshtunnel>=0.4",
  # UNICO techo del proyecto, con incompatibilidad concreta y verificada:
  # sshtunnel 0.4.0 (ultima release, 2021) referencia `paramiko.DSSKey` dentro de
  # get_keys(), que se llama en cada construccion del forwarder. paramiko elimino
  # DSSKey en 4.0.0, asi que con paramiko>=4 el tunel truena con
  # `AttributeError: module 'paramiko' has no attribute 'DSSKey'`.
  # Verificado en 2026-08-12 con paramiko 4.0.0 y 5.0.0. Ultima compatible: 3.5.1.
  # Compatible con el `paramiko==3.5.0` que pinean redshift_extractor y mongo_extractor.
  # Se quita cuando salga una sshtunnel que soporte paramiko>=4.
  "paramiko>=2.7.2,<4",
  "keyring>=24",
  "typer>=0.12",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
postgres-local-client = "postgres_local_client.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["postgres_local_client*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Explicito porque el conjunto por default de ruff cambia entre versiones y el rango
# declarado es `ruff>=0.6`. Este es el mismo conjunto efectivo que usan las hermanas.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp propio del proyecto: el default (%TEMP%\pytest-of-<usuario>) deja un
# symlink `pytest-current` que en esta maquina no se puede resolver ni borrar, y la
# limpieza de fin de sesion truena con PermissionError aunque todos los tests pasen.
addopts = "--basetemp=.pytest_tmp"
markers = [
  "integration: requiere una base PostgreSQL alcanzable (se salta si no hay)",
  "coexistence: convivencia con las librerias hermanas del ecosistema",
  "sshserver: requiere el servidor SSH de prueba en proceso (paramiko)",
]
